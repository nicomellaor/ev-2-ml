random_seed: 42 
task_type: 'classification' 

data:
  path: 'data/data_cleaned.csv' 
  target_col: 'satisfaction' 
  test_size: 0.2

  schema:
    numerical_cols:
      - 'Age'
      - 'Flight Distance'
      - 'Inflight wifi service'
      - 'Departure/Arrival time convenient'
      - 'Ease of Online booking'
      - 'Gate location'
      - 'Food and drink'
      - 'Online boarding'
      - 'Seat comfort'
      - 'Inflight entertainment'
      - 'On-board service'
      - 'Leg room service'
      - 'Baggage handling'
      - 'Checkin service'
      - 'Inflight service'
      - 'Cleanliness'
      - 'Departure Delay in Minutes'
      - 'Arrival Delay in Minutes'
    categorical_cols:
      - 'Gender'
      - 'Customer Type'
      - 'Type of Travel'
      - 'Class'
    
    max_null_percentage: 0.3
  
  report_path: 'outputs/data_report.txt'

preprocessing:
  use_pca: true 
  pca_variance_target: 0.95 

supervised:
  cv_metric: 'roc_auc' 
  cv_folds: 5 
  random_search_iterations: 10 
  run_random_search: false
  run_grid_search: true

  models:
    baseline: 
      model_name: 'LogisticRegression'
      params:
        random_search_space:
          model__C: [0.01, 0.1, 0.5, 1, 5, 10, 50, 100]
          model__solver: ['liblinear']
          model__penalty: ['l1', 'l2']
        grid_search_space:
          model__C: [80, 100, 120, 150]
          model__solver: ['liblinear']
          model__penalty: ['l2']
          
    random_forest:
      model_name: 'RandomForestClassifier'
      use_class_weight: true
      params:
        random_search_space:
          model__n_estimators: [100, 200, 300]
          model__max_depth: [5, 10, 20, null]
          model__max_features: ['sqrt', 'log2']
          model__min_samples_leaf: [1, 2, 4]
        grid_search_space:
          model__n_estimators: [90, 100, 110]
          model__max_depth: [20, 30, null]
          model__max_features: ['sqrt']
          model__min_samples_leaf: [1, 2]

unsupervised:
  k_range: [2, 3, 4, 5, 6, 7, 8]
  k: 2